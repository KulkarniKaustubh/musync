<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>musync</title>
<link rel="icon" href="icons/icon-192.png">
<!-- Lets a phone keep musync on its home screen: "Add to Home Screen" on iPhone, "Install" on Android. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="musync">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101011">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="banner" class="banner" role="status" hidden></div>
<div id="app"></div>

<dialog id="search-sheet" class="sheet sheet-tall" aria-labelledby="search-title">
  <form class="sheet-head" id="search-form" role="search">
    <h2 id="search-title">Add a song</h2>
    <button type="button" class="btn btn-ghost" data-close>Done</button>
    <div class="searchbox">
      <span class="searchbox-icon" data-icon="search"></span>
      <label class="visually-hidden" for="search-input">Search songs or artists</label>
      <input id="search-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
             spellcheck="false" placeholder="Songs or artists">
    </div>
    <div class="chips" id="scope-chips" role="group" aria-label="Which service plays the song" hidden></div>
    <div class="library-row" id="library-row" hidden></div>
  </form>
  <p class="sheet-note" id="search-note"></p>
  <ul class="list results" id="results" aria-live="polite"></ul>
</dialog>

<dialog id="people-sheet" class="sheet" aria-labelledby="people-title">
  <div class="sheet-head sheet-head-plain">
    <h2 id="people-title">Room</h2>
    <button type="button" class="btn btn-ghost" data-close>Done</button>
  </div>
  <div class="sheet-body" id="people-body"></div>
</dialog>

<dialog id="service-sheet" class="sheet" aria-labelledby="service-title">
  <div class="sheet-head sheet-head-plain">
    <h2 id="service-title">Your music app</h2>
    <button type="button" class="btn btn-ghost" data-close>Cancel</button>
  </div>
  <div class="sheet-body" id="service-body"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<audio id="player" preload="auto"></audio>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
